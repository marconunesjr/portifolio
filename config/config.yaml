# Metas fictícias e arbitradas. sentido: maior = quanto maior, melhor; menor = quanto menor, melhor.
# Semáforo: verde atinge a meta; amarelo fica até "tolerancia_amarelo" pontos percentuais fora; vermelho além disso.
metas:
  K01_otd:                 {meta: 95.0, sentido: maior, tolerancia_amarelo: 3.0}
  K07_piso_vencido:        {meta: 5.0,  sentido: menor, tolerancia_amarelo: 3.0}
  K12_aderencia_forecast:  {meta: 95.0, sentido: maior, tolerancia_amarelo: 5.0}
  K15_sla_transito:        {meta: 92.0, sentido: maior, tolerancia_amarelo: 3.0}
  K16_sla_expedicao:       {meta: 95.0, sentido: maior, tolerancia_amarelo: 3.0}
  K19_pct_transferido:     {meta: 98.0, sentido: maior, tolerancia_amarelo: 1.0}
  K20_sla_coleta:          {meta: 90.0, sentido: maior, tolerancia_amarelo: 4.0}

faixas:
  aging_piso_dias: ["0-1", "2-3", "4-7", "8+"]
  aging_atraso_dias_uteis: ["1", "2-3", "4-5", "6+"]
  peso_kg: ["0-1", "1-5", "5-30", "30+"]

qualidade:
