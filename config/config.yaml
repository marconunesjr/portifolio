# Parâmetros do Portfólio de BIs de Logística. Nada aqui é sensível.
empresa:
  nome: "Aurora Log"
  aviso: "Dados fictícios, gerados para fins de portfólio."

geracao:
  semente: 42
  data_referencia: "2026-10-31"
  data_inicio: "2026-08-03"        # 90 dias até a data de referência
  linhas:
    bi1_ctes: 30000
    bi2_piso: 8000
    bi4_viagens: 6000
    bi4_manifestos: 9000
    bi5_coletas: 15000
  operadores_por_unidade: 12
  couriers_por_unidade: 15

calendario:
  dias_uteis: [segunda, terca, quarta, quinta, sexta]
  feriados_nacionais:
    - "2026-09-07"
    - "2026-10-12"
    - "2026-11-02"

regionais:
  São Paulo: [SPO, CPQ]
  Sudeste: [RJO, BHZ]
  Sul: [CWB, POA, FLN]
  Nordeste: [SSA, REC, FOR]
  Centro-Oeste: [BSB, GYN]

unidades:
  SPO: {nome: "CD São Paulo", uf: SP}
  CPQ: {nome: "CD Campinas", uf: SP}
  RJO: {nome: "CD Rio de Janeiro", uf: RJ}
  BHZ: {nome: "CD Belo Horizonte", uf: MG}
  CWB: {nome: "CD Curitiba", uf: PR}
  POA: {nome: "CD Porto Alegre", uf: RS}
  FLN: {nome: "CD Florianópolis", uf: SC}
  SSA: {nome: "CD Salvador", uf: BA}
  REC: {nome: "CD Recife", uf: PE}
  FOR: {nome: "CD Fortaleza", uf: CE}
  BSB: {nome: "CD Brasília", uf: DF}
  GYN: {nome: "CD Goiânia", uf: GO}

# Nomes inventados; conferir que não coincidem com marcas conhecidas antes de publicar.
clientes:
  - Casa Prisma
  - Mercado Jaspe
  - Loja Tucano
  - Eletro Seriema
  - Botica Serena
  - Moda Seriguela
  - Livraria Farol
  - Pet Baobá
  - Esporte Quartzo
  - Tech Colibri
  - Lar Marfim
  - Bazar Sabiá
  - Ótica Lume
  - Brinquedos Pipa
  - Empório Cedro

# Metas fictícias e arbitradas. sentido: maior = quanto maior, melhor; menor = quanto menor, melhor.
# Semáforo: verde atinge a meta; amarelo fica até "tolerancia_amarelo" pontos percentuais fora; vermelho além disso.
metas:
  K01_otd:                 {meta: 95.0, sentido: maior, tolerancia_amarelo: 3.0}
  K07_piso_vencido:        {meta: 5.0,  sentido: menor, tolerancia_amarelo: 3.0}
  K12_aderencia_forecast:  {meta: 95.0, sentido: maior, tolerancia_amarelo: 5.0}
  K15_sla_transito:        {meta: 92.0, sentido: maior, tolerancia_amarelo: 3.0}
  K16_sla_expedicao:       {meta: 95.0, sentido: maior, tolerancia_amarelo: 3.0}
  K19_pct_transferido:     {meta: 98.0, sentido: maior, tolerancia_amarelo: 1.0}
  K20_sla_coleta:          {meta: 90.0, sentido: maior, tolerancia_amarelo: 4.0}

faixas:
  aging_piso_dias: ["0-1", "2-3", "4-7", "8+"]
  aging_atraso_dias_uteis: ["1", "2-3", "4-5", "6+"]
  peso_kg: ["0-1", "1-5", "5-30", "30+"]

# Segmento de cada cliente (dim_clientes.segmento).
segmentos_clientes:
  Casa Prisma: casa
  Mercado Jaspe: outros
  Loja Tucano: moda
  Eletro Seriema: eletrônicos
  Botica Serena: saúde e beleza
  Moda Seriguela: moda
  Livraria Farol: outros
  Pet Baobá: outros
  Esporte Quartzo: moda
  Tech Colibri: eletrônicos
  Lar Marfim: casa
  Bazar Sabiá: casa
  Ótica Lume: saúde e beleza
  Brinquedos Pipa: outros
  Empório Cedro: outros

# Cenário dos dados sintéticos: ofensores que fazem as análises contarem uma história (docs/03).
cenario:
  clientes_por_unidade: 8               # clientes atendidos por unidade na produção e no forecast
  unidades_ofensoras_otd: [SSA, REC]    # destino com OTD bem abaixo da meta
  clientes_ofensores_otd: [CL04, CL06]  # Eletro Seriema e Moda Seriguela
  unidade_ofensora_piso: RJO            # mais piso vencido
  unidade_ofensora_entrada: BHZ         # mais CT-es transferidos sem entrada
  unidade_ofensora_forecast: POA        # produção abaixo do previsto
  unidade_ofensora_transferencia: CWB   # manifestos incompletos
  fornecedor_ofensor: FN05              # atraso recorrente no trânsito
  regional_ofensora_coleta: Nordeste    # coleta fora do prazo
  # Porte relativo de cada unidade (multiplica volumes e sorteios).
  porte_unidades: {SPO: 1.8, CPQ: 1.0, RJO: 1.4, BHZ: 1.1, CWB: 0.9, POA: 0.8, FLN: 0.6,
                   SSA: 0.8, REC: 0.8, FOR: 0.6, BSB: 0.7, GYN: 0.6}
  # Fator de volume por dia da semana (segunda a domingo) e em feriado.
  fator_dia_semana: [1.05, 1.0, 1.0, 1.0, 0.95, 0.45, 0.2]
  fator_feriado: 0.3
  volume_producao_dia: 9000             # volumes recebidos por dia útil na rede, aproximado
  volume_emissoes_dia: 6000             # remessas emitidas por dia útil na rede, aproximado

qualidade:
  lead_time_max_dias_uteis: 30
  viagem_max_horas: 96
  produtividade_max_volumes_hora: 600

caminhos:
  dados: "src/dados"
  site: "src"
  publicacao: "dist"
