# Publica dist/ no GitHub Pages a cada push no ramo main (ou manualmente).
# Antes de publicar, roda os testes dos KPIs e confere que dist/ é cópia fiel de src/.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes dos KPIs (node --test)
        run: node --test tests/

      - name: Montar dist/ a partir de src/
        run: python scripts/montar_dist.py

      - name: Conferir que dist/ versionada está atualizada
        run: git diff --exit-code -- dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
